<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a26">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Die kostenlose Reihenzähler-App zu „Dein Strick-Adventskalender: 24 Türchen, ein Schal“ von Munich Publishing. Alle 324 Reihen einzeln, Maschen-Check nach jedem Türchen, Fehlerhilfe und Rätsel-Tipps. Ohne Account, ohne Abo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mein Schal">
  <meta property="og:title" content="Mein Schal – Reihenzähler-App zum Strick-Adventskalender">
  <meta property="og:description" content="Alle 324 Reihen einzeln, Maschen-Check und Fehlerhilfe. Ohne Account, ohne Abo.">
  <meta property="og:image" content="https://tools.munichpublishing.de/strick-schal/assets/book-cover.jpg">
  <meta property="og:url" content="https://tools.munichpublishing.de/strick-schal/">
  <meta name="robots" content="noindex">
  <title>Mein Schal – Reihenzähler-App zum Strick-Adventskalender</title>
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div class="shell">
    <header class="top">
      <button class="brand" type="button" data-go="">
        <img src="icons/favicon-64.png" alt="" width="36" height="36">
        <span><strong>Mein Schal</strong><small id="sub">24 Türchen, ein Schal</small></span>
      </button>
      <button class="icon" id="menu-open" type="button" aria-label="Menü öffnen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </header>
    <main id="app" tabindex="-1"><p class="loading">Dein Schal wird geladen.</p></main>
    <nav class="tabs" aria-label="Hauptnavigation">
      <button type="button" data-go="" data-nav="start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4v-8.5Z"/></svg><span>Start</span></button>
      <button type="button" data-go="reihe" data-nav="reihe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Reihen</span></button>
      <button type="button" data-go="tuerchen" data-nav="tuerchen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Türchen</span></button>
      <button type="button" data-go="hilfe" data-nav="hilfe"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.5M12 17h.01"/></svg><span>Hilfe</span></button>
    </nav>
  </div>

  <dialog id="menu" class="sheet" aria-labelledby="menu-h">
    <div class="sheet-in">
      <h2 id="menu-h">Menü</h2>
      <button class="row-link" type="button" data-go="anschlagen" data-close>Maschen anschlagen <span class="pill">Extra für Anfänger</span></button>
      <button class="row-link" type="button" data-go="installieren" data-close>Auf den Startbildschirm legen</button>
      <button class="row-link" type="button" data-go="stand" data-close>Reihe von Hand einstellen</button>
      <button class="row-link" type="button" data-go="info" data-close>Über die App und Impressum</button>
      <button class="row-link danger" type="button" id="reset">Alles zurücksetzen</button>
      <button class="button ghost" type="button" data-close>Schließen</button>
    </div>
  </dialog>

  <dialog id="lightbox" class="lightbox"><figure><img alt=""><figcaption></figcaption></figure><button class="button" type="button" data-close>Schließen</button></dialog>

  <script src="data.js?v=1"></script>
  <script src="anschlagen.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
