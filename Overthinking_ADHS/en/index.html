<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://tools.munichpublishing.de/Overthinking_ADHD/">
    <title>Redirecting to the English ADHD Companion</title>
    <script>
      const destination = new URL("/Overthinking_ADHD/", window.location.origin);
      destination.search = window.location.search;
      destination.hash = window.location.hash || "#today";
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p><a href="/Overthinking_ADHD/#today">Open the English ADHD Companion</a></p>
  </body>
</html>
