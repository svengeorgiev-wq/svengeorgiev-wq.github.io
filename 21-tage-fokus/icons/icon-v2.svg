<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ADHS bei Frauen – 21 Tage</title>
  <desc id="desc">App-Symbol mit dem Text: ADHS bei Frauen – 21 Tage für weniger Chaos im Kopf</desc>
  <defs>
    <linearGradient id="gold" x1="62" y1="42" x2="454" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".54" stop-color="#edcc78"/>
      <stop offset="1" stop-color="#c88c20"/>
    </linearGradient>
    <linearGradient id="navy" x1="136" y1="92" x2="392" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#174f83"/>
      <stop offset=".56" stop-color="#082f67"/>
      <stop offset="1" stop-color="#041b39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#082f67" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#gold)"/>
  <circle cx="91" cy="76" r="92" fill="#fff9e7" opacity=".42"/>
  <circle cx="448" cy="436" r="146" fill="#163f6d" opacity=".22"/>
  <rect x="34" y="34" width="444" height="444" rx="94" fill="#fffaf0" fill-opacity=".64" stroke="#fff" stroke-opacity=".82" stroke-width="4" filter="url(#shadow)"/>
  <rect x="43" y="43" width="426" height="426" rx="84" fill="none" stroke="#082f67" stroke-opacity=".22" stroke-width="3"/>

  <text x="256" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="700" letter-spacing="-5" fill="#082f67">ADHS</text>
  <text x="256" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="4" fill="#082f67">BEI FRAUEN</text>

  <path d="M106 249h112M294 249h112" stroke="#c88c20" stroke-width="5" stroke-linecap="round"/>
  <path d="m256 237 12 12-12 12-12-12Z" fill="#c88c20"/>

  <rect x="91" y="282" width="330" height="102" rx="45" fill="url(#navy)" stroke="#fff" stroke-opacity=".58" stroke-width="3"/>
  <text x="256" y="355" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#fff5d3">21 TAGE</text>

  <text x="256" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#082f67">FÜR WENIGER CHAOS</text>
  <text x="256" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="2" fill="#082f67">IM KOPF</text>
</svg>
