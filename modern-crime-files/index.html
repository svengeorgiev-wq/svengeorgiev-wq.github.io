<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sherlock Modern Crime Files – Bonus-Fallarchiv</title>
<meta name="description" content="Zehn Bonusfälle zum Buch Sherlock Modern Crime Files. Drei Ebenen pro Fall, Antwortprüfung, Tipp und Lösungsweg. Ohne Account.">
<meta name="theme-color" content="#0b1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fallarchiv">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b1420; --bg2:#101b29; --panel:#142233; --panel2:#1a2a3e; --line:#26384f;
  --gold:#d4b46a; --gold2:#b8954a; --gold-soft:rgba(212,180,106,.14);
  --text:#ece6d8; --muted:#a3abb7; --ok:#7fc29b; --ok-soft:rgba(127,194,155,.13);
  --bad:#e08a7a; --bad-soft:rgba(224,138,122,.13);
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);
  background-image:radial-gradient(1200px 500px at 50% -200px,#1b2c44 0%,transparent 70%);
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}

/* brand */
.brand{text-align:center;padding:28px 0 6px}
.brand .hat{width:38px;height:38px;margin:0 auto 6px;display:block}
.brand .s{font-family:var(--serif);font-weight:700;letter-spacing:.06em;font-size:clamp(34px,9vw,52px);line-height:1;
  background:linear-gradient(180deg,#f3dc9c 0%,#d4b46a 45%,#a8823c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .m{font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--gold);margin-top:8px}
.brand .rule{width:72px;height:1px;background:var(--gold2);margin:14px auto 0;opacity:.8}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* intro + progress */
.lead{text-align:center;color:var(--muted);max-width:520px;margin:14px auto 22px}
.progress{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.progress b{font-family:var(--serif);font-size:20px}
.bar{height:6px;background:#0d1724;border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .4s}

.notice{border:1px dashed var(--gold2);background:var(--gold-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;font-size:14px}

/* case list */
.list{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--gold2)}
.card:active{transform:scale(.99)}
.card .no{flex:0 0 46px;height:46px;border-radius:10px;border:1px solid var(--gold2);display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;color:var(--gold);font-size:18px}
.card .t{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25}
.card .o{font-size:13px;color:var(--muted);margin-top:2px}
.card .dots{display:flex;gap:5px;margin-top:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold2)}
.dot.on{background:var(--gold);border-color:var(--gold)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.card .go{margin-left:auto;color:var(--gold);font-size:22px;line-height:1}
.card.locked{opacity:.55}
.card.done .no{background:var(--gold);color:#1a1408}

/* case view */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.back:hover{border-color:var(--gold2)}
.top .crumb{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-left:auto}
.hero{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;background:var(--panel)}
.hero .band{background:#070d16;padding:10px 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;display:flex;justify-content:space-between;gap:10px}
.hero .band span:last-child{color:var(--gold)}
.hero .in{padding:16px 18px 18px}
h1.ct{font-family:var(--serif);font-size:clamp(24px,6vw,32px);line-height:1.15;margin:4px 0 12px}
.hero p{margin:0 0 10px}
.dialog{border-left:3px solid var(--gold);padding:8px 12px;background:var(--gold-soft);border-radius:0 10px 10px 0;font-family:var(--serif);font-style:italic;margin-top:12px}

.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.sec h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
ul.facts{margin:0;padding-left:18px}
ul.facts li{margin:4px 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.av{flex:0 0 36px;height:36px;border-radius:50%;background:#22344b;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gold)}
.person b{display:block;font-size:14px;line-height:1.2}
.person small{color:var(--muted);font-size:12px}

/* levels */
.lvl{border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;background:var(--panel)}
.lvl .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0c1622;border-bottom:1px solid var(--line)}
.lvl .hd .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.lvl .hd .st{margin-left:auto;font-size:12px;color:var(--muted)}
.lvl .hd .st.ok{color:var(--ok)}
.lvl .bd{padding:16px 18px}
.lvl.locked .bd{color:var(--muted);font-size:14px}
.anl{color:var(--muted);margin:0 0 12px}
.hints{list-style:none;margin:0 0 14px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.hints li{padding:5px 0 5px 18px;position:relative;font-family:var(--serif)}
.hints li:before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.q{font-weight:700;margin:4px 0 10px;font-family:var(--serif);font-size:17px}
.opts{display:grid;gap:8px}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;min-height:48px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--gold2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;font-size:15px;min-height:1px}
.fb .bad{color:var(--bad)}
.fb .good{color:var(--ok);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.link{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--gold)}
.link:hover{border-color:var(--gold2)}
.tip,.sol{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px}
.tip{background:var(--gold-soft);border:1px solid rgba(212,180,106,.35)}
.sol{background:var(--ok-soft);border:1px solid rgba(127,194,155,.35)}
.sol b,.tip b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.end{text-align:center;border:1px solid var(--gold2);border-radius:var(--r);padding:20px 18px;margin-bottom:16px;background:linear-gradient(180deg,rgba(212,180,106,.12),transparent)}
.end .big{font-family:var(--serif);font-size:24px;margin:6px 0 10px}
.end .dialog{text-align:left}
.btn{display:inline-block;background:var(--gold);color:#1a1408;border:0;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;margin-top:14px}
.btn:hover{background:#e2c47e}
textarea{width:100%;min-height:110px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 var(--sans);resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
footer .priv{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin-bottom:12px}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}

.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--panel2);
  border:1px solid var(--gold2);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:20;font-size:14px}
.install .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1}
.install .btn{margin:0;padding:8px 14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="install hidden" id="install" role="dialog" aria-label="App installieren">
  <div id="installText">Das Fallarchiv als App auf dem Startbildschirm ablegen?</div>
  <button class="btn hidden" id="installBtn">Installieren</button>
  <button class="x" id="installX" aria-label="Hinweis schließen">×</button>
</div>

<script>
const CASES = [
{
  id: 'b01', nr: '01', titel: 'Das Leck im 31. Stock', ort: 'Kanzlei Hallberg & Rauch', zeit: '19:40–19:52', stufe: 'leicht',
  intro: [
    'Die Vergleichsjuristin Marlene Ott wird um 19:52 Uhr benommen im Kopierraum gefunden. Der vertrauliche Vergleichsentwurf liegt wieder in ihrer Mappe. Das Kopiersystem zählt allerdings zwölf Seiten mehr als am Nachmittag.',
    'Voss steht vor dem Kopierer, der seit Stunden „Papierstau“ meldet. Sie sehen auf den Zähler des Systems. Zwölf Seiten. Irgendwo im Haus liegt jetzt eine zweite Fassung.'

  dialog: '„Vier Personen, vier Aussagen.“ – „Und genau eine davon passt nicht zu den anderen.“',
  fakten: ['Ab 19:40 Uhr war die Kanzlei für Besucher geschlossen.', 'Genau eine Person nahm den Entwurf an sich.', 'Genau eine der vier Aussagen ist falsch.'],
  personen: [['Ida Sommer', 'Partnerin'], ['Felix Aumann', 'Associate'], ['Nele Krug', 'Assistentin'], ['Paul Weidner', 'IT-Administrator']],
  ebenen: [
    { typ: 'Aussagenlogik',

      optionen: ['Ida Sommer', 'Felix Aumann', 'Nele Krug', 'Paul Weidner'], loesung: 2,

    { typ: 'Garderobenliste',
      anleitung: 'Nutzen Sie die Person aus Ebene 1. Jede Person trug genau einen der vier Gegenstände bei sich: Aktenkoffer, Regenschirm, Kopierkarte, Laptoptasche.',

      frage: 'Welchen Gegenstand trug die Täterperson?',
      optionen: ['Aktenkoffer', 'Regenschirm', 'Kopierkarte', 'Laptoptasche'], loesung: 2,

      erklaerung: 'Ida und Felix sind festgelegt. Für Paul und Nele bleiben Kopierkarte und Laptoptasche. Paul hatte die Kopierkarte nicht, also trug Nele sie.' },

{
  id: 'b02', nr: '02', titel: 'Zwölf Minuten im Uhrenmuseum', ort: 'Haus der Zeit, Museumsnacht', zeit: '22:30–22:42', stufe: 'leicht',
  intro: [
    'Während der Museumsnacht wird Sammlungsleiter Bernhard Ilg um 22:42 Uhr benommen im Vitrinenraum gefunden. Eine der ausgestellten Taschenuhren wurde gegen eine Replik getauscht.',
    'Voss zählt die Uhren an der Wand. Alle zeigen dieselbe Zeit. Sie interessieren sich mehr für die Lücken zwischen den Protokollen.'
  ],
  dialog: '„Zwölf Minuten sind nicht viel.“ – „Für einen Tausch reichen sechs.“',
  fakten: ['Der Tausch dauerte mindestens sechs Minuten ohne Unterbrechung im Vitrinenraum.', 'Der Weg zum Vitrinenraum dauert eine Minute, der Rückweg ebenfalls.', 'Alle Zeitangaben stammen aus synchronisierten Systemen.'],

      erklaerung: 'Lara hat vier freie Minuten (22:35–22:39), abzüglich Weg bleiben zwei. Mehmets längste Lücke beträgt fünf Minuten, es bleiben drei. Clara hat höchstens zwei freie Minuten. Nur Jonas ist von 22:33 bis 22:41 Uhr ohne Beleg: acht Minuten, abzüglich Weg genau sechs.' },

{

      frage: 'In welchem Schließfach liegt der Umschlag?',

const AMAZON_URL = 'AMAZON-URL-HIER';
const PROBE_IDS = ['b01', 'b02'];
const PROBE = new URLSearchParams(location.search).get('zugang') === 'probe';
const KEY = 'mcf-bonus-v1';

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.lv = S.lv || {};        // caseId -> [state,state,state]  state: 0 open, 1 solved, 2 revealed
S.tries = S.tries || {};  // caseId-level -> number of wrong answers
S.notes = S.notes || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lv = id => S.lv[id] || [0, 0, 0];
const caseDone = id => lv(id).every(x => x > 0);
const locked = c => PROBE && !PROBE_IDS.includes(c.id);
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2);

const HAT = '<svg class="hat" viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="27" r="15" fill="none" stroke="#d4b46a" stroke-width="5"/><line x1="38" y1="38" x2="55" y2="55" stroke="#d4b46a" stroke-width="7" stroke-linecap="round"/></svg>';

function home() {
  const done = CASES.filter(c => !locked(c) && caseDone(c.id)).length;
  const avail = PROBE ? PROBE_IDS.length : CASES.length;
  app.innerHTML = `
    <header class="brand">${HAT}
      <div class="s">SHERLOCK</div>
      <div class="m">MODERN CRIME FILES</div>
      <div class="rule"></div>
    </header>
    <p class="kicker" style="text-align:center;margin:16px 0 0">Bonus-Fallarchiv</p>
    <p class="lead">${PROBE
      ? 'Zwei Fälle aus dem Bonusarchiv zum Ausprobieren. Drei Ebenen pro Fall, jede Antwort wird direkt geprüft.'
      : 'Zehn neue Fälle nach dem Buch. Drei Ebenen pro Fall, jede Antwort wird direkt geprüft, Tipp und Lösungsweg inklusive.'}</p>
    ${PROBE ? `<div class="notice">Sie spielen die Probefassung. Die übrigen acht Bonusfälle sind für Leserinnen und Leser des Buchs freigeschaltet, zusammen mit den 20 Fällen im Buch selbst.${AMAZON_URL.startsWith('http') ? ` <a href="${AMAZON_URL}" target="_blank" rel="noopener">Zum Buch auf Amazon</a>` : ''}</div>` : ''}
    <div class="progress">
      <div class="row"><span class="kicker">Fortschritt</span><b>${done} von ${avail} Fällen gelöst</b></div>
      <div class="bar"><i style="width:${Math.round(done / avail * 100)}%"></i></div>
    </div>
    <div class="list">
      ${CASES.map(c => {
        const l = lv(c.id), lock = locked(c), d = caseDone(c.id);
        return `<button class="card${lock ? ' locked' : ''}${d ? ' done' : ''}" data-id="${c.id}" ${lock ? 'aria-disabled="true"' : ''}>
          <span class="no">${c.nr}</span>
          <span><span class="t">${esc(c.titel)}</span>
            <span class="o" style="display:block">${esc(c.ort)} · <span style="white-space:nowrap">${esc(c.zeit)}</span></span>
            <span class="dots">${lock ? '<span class="tag" style="margin:0">Im Buch freigeschaltet</span>'
              : l.map(x => `<span class="dot${x ? ' on' : ''}"></span>`).join('') + `<span class="tag">${c.stufe}</span>`}</span>
          </span>
          <span class="go" aria-hidden="true">${lock ? '🔒' : '›'}</span>
        </button>`;
      }).join('')}
    </div>
    <footer>
      <div class="priv">🔒 Ohne Account. Ihr Fortschritt bleibt auf diesem Gerät.</div><br>
      <button class="reset" id="reset">Fortschritt zurücksetzen</button>
      <p>© 2026 Munich Publishing · Personen und Ereignisse sind fiktiv.</p>
    </footer>`;
  app.querySelectorAll('.card').forEach(b => b.onclick = () => {
    const c = CASES.find(x => x.id === b.dataset.id);
    if (locked(c)) return;
    location.hash = c.id;
  });
  document.getElementById('reset').onclick = () => {
    if (confirmReset()) { S = { lv: {}, tries: {}, notes: {} }; save(); home(); }
  };
}

// inline confirmation instead of a blocking browser dialog
let resetArmed = false;
function confirmReset() {
  const b = document.getElementById('reset');
  if (!resetArmed) { resetArmed = true; b.textContent = 'Wirklich alles zurücksetzen? Zum Bestätigen erneut tippen.'; setTimeout(() => { resetArmed = false; if (b.isConnected) b.textContent = 'Fortschritt zurücksetzen'; }, 4000); return false; }
  resetArmed = false; return true;
}

function view(id) {
  const c = CASES.find(x => x.id === id);
  if (!c || locked(c)) { location.hash = ''; return; }
  const l = lv(c.id);
  const idx = CASES.indexOf(c);
  let next = CASES.slice(idx + 1).find(x => !locked(x));
  app.innerHTML = `
    <div class="top"><button class="back" id="back">‹ Fallarchiv</button><span class="crumb">Bonusfall ${c.nr}</span></div>
    <article class="hero">
      <div class="band"><span>${esc(c.ort)}</span><span>${esc(c.zeit)}</span></div>
      <div class="in">
        <div class="kicker">Bonusfall ${c.nr} · ${c.stufe}</div>
        <h1 class="ct">${esc(c.titel)}</h1>
        ${c.intro.map(p => `<p>${esc(p)}</p>`).join('')}
        <div class="dialog">${esc(c.dialog)}</div>
      </div>
    </article>
    <section class="sec"><h2>Gesicherte Fakten</h2><ul class="facts">${c.fakten.map(f => `<li>${esc(f)}</li>`).join('')}</ul></section>
    <section class="sec"><h2>Beteiligte</h2><div class="people">${c.personen.map(p => `<div class="person"><span class="av">${initials(p[0])}</span><span><b>${esc(p[0])}</b><small>${esc(p[1])}</small></span></div>`).join('')}</div></section>
    ${c.ebenen.map((e, i) => level(c, e, i, l)).join('')}
    ${caseDone(c.id) ? `<div class="end"><div class="kicker">Fall abgeschlossen</div><div class="big">${esc(c.ebenen[0].optionen[c.ebenen[0].loesung])} · ${esc(c.ebenen[1].optionen[c.ebenen[1].loesung])} · ${esc(c.ebenen[2].optionen[c.ebenen[2].loesung])}</div><div class="dialog">${esc(c.schluss)}</div>${next ? `<a class="btn" href="#${next.id}">Nächster Fall: ${esc(next.titel)} ›</a>` : '<a class="btn" href="#">Zurück zum Fallarchiv</a>'}</div>` : ''}
    <section class="sec"><h2>Notizen des Ermittlers</h2><textarea id="notes" placeholder="Platz für Ihre Überlegungen. Wird nur auf diesem Gerät gespeichert.">${esc(S.notes[c.id] || '')}</textarea></section>`;
  document.getElementById('back').onclick = () => { location.hash = ''; };
  document.getElementById('notes').oninput = ev => { S.notes[c.id] = ev.target.value; save(); };
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(c, +b.dataset.l, +b.dataset.o));
  app.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => { document.getElementById('tip-' + b.dataset.tip).classList.remove('hidden'); b.remove(); });
  app.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => reveal(c, +b.dataset.reveal));
}

function level(c, e, i, l) {
  const open = i === 0 || l[i - 1] > 0;
  const st = l[i];
  const head = `<div class="hd"><span class="k">Ebene ${i + 1} · ${esc(e.typ)}</span><span class="st${st ? ' ok' : ''}">${st === 1 ? '✓ gelöst' : st === 2 ? '✓ aufgedeckt' : open ? 'offen' : 'gesperrt'}</span></div>`;
  if (!open) return `<section class="lvl locked">${head}<div class="bd">Lösen Sie zuerst Ebene ${i}. Diese Ebene baut auf dem Ergebnis auf.</div></section>`;
  const tries = S.tries[c.id + i] || 0;
  return `<section class="lvl" id="lvl-${i}">${head}<div class="bd">
    <p class="anl">${esc(e.anleitung)}</p>
    <ul class="hints">${e.hinweise.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
    <p class="q">● ${esc(e.frage)}</p>
    <div class="opts">${e.optionen.map((o, k) => `<button class="opt${st && k === e.loesung ? ' right' : ''}" data-l="${i}" data-o="${k}" ${st ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    <div class="fb" id="fb-${i}" aria-live="polite">${st === 1 ? '<span class="good">Richtig. Die Akte stützt genau diese Antwort.</span>' : ''}</div>
    ${st ? `<div class="sol"><b>Lösungsweg</b>${esc(e.erklaerung)}</div>` : `
      <div class="tools"><button class="link" data-tip="${i}">Tipp anzeigen</button>${tries ? `<button class="link" data-reveal="${i}">Auflösung zeigen</button>` : ''}</div>
      <div class="tip hidden" id="tip-${i}"><b>Tipp</b>${esc(e.tipp)}</div>`}
  </div></section>`;
}

function answer(c, i, o) {
  const e = c.ebenen[i];
  if (o === e.loesung) {
    const l = lv(c.id).slice(); l[i] = 1; S.lv[c.id] = l; save();
    view(c.id);
    const el = document.getElementById(i < 2 ? 'lvl-' + (i + 1) : 'lvl-2');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: i < 2 ? 'start' : 'center' });
  } else {
    S.tries[c.id + i] = (S.tries[c.id + i] || 0) + 1; save();
    const btn = app.querySelector(`.opt[data-l="${i}"][data-o="${o}"]`);
    btn.classList.add('wrong'); btn.disabled = true;
    document.getElementById('fb-' + i).innerHTML = '<span class="bad">Nicht schlüssig. Mindestens ein Hinweis passt nicht zu dieser Antwort.</span>';
    const tools = btn.closest('.bd').querySelector('.tools');
    if (tools && !tools.querySelector('[data-reveal]')) {
      const r = document.createElement('button'); r.className = 'link'; r.dataset.reveal = i; r.textContent = 'Auflösung zeigen';
      r.onclick = () => reveal(c, i); tools.appendChild(r);
    }
  }
}

function reveal(c, i) {
  const l = lv(c.id).slice(); l[i] = 2; S.lv[c.id] = l; save();
  view(c.id);
  const el = document.getElementById('lvl-' + i); if (el) el.scrollIntoView({ block: 'start' });
}

function route() {
  const id = location.hash.slice(1);
  if (id) view(id); else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

/* install hint */
(function () {
  const box = document.getElementById('install'), btn = document.getElementById('installBtn'), txt = document.getElementById('installText');
  let dismissed = false; try { dismissed = localStorage.getItem('mcf-install-x') === '1'; } catch (e) {}
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (dismissed || standalone) return;
  let deferred = null;
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); deferred = ev; btn.classList.remove('hidden'); box.classList.remove('hidden'); });
  btn.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.classList.add('hidden'); };
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
  if (ios) { txt.innerHTML = 'Als App nutzen: in Safari auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.'; setTimeout(() => box.classList.remove('hidden'), 2500); }
  document.getElementById('installX').onclick = () => { box.classList.add('hidden'); try { localStorage.setItem('mcf-install-x', '1'); } catch (e) {} };
})();
</script>
</body>
